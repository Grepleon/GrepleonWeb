<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title> Grepleon </title>
    <link rel="stylesheet" href="styles/main_style.css">
    <link rel="stylesheet" href="styles/sides.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/fon.css">

    <script src="scripts/langs.js" defer> </script>
    <script src="scripts/hover.js" defer> </script>
    <script src="scripts/change_lang.js" defer> </script>
    <script src="scripts/glow.js" defer> </script>

    <link rel="icon" type="image/png" href="res/Grepleon%202026.08%20logo-circle.png">
</head>
<body class="main-body">
    <nav class="top-menu">
        <a id="nav-about" href="#about"></a>
        <a id="nav-projects" href="#projects"></a>
        <a id="nav-languages" href="#languages"></a>
        <a id="nav-contacts" href="#contacts"></a>
    </nav>

    <div class="page">
        <div class="left-side">
            <h1 class="main-color" id="name"> </h1>
            <img id="logo" class="my-logo" src="res/Grepleon%202026.08%20logo150.png" alt="logo-Grepleon">
            <h3 id="job"> </h3>
            <p class="dim" id="des"> </p>

            <button id="button-ru" type="button" class="button-lang"> Русский </button>
            <button id="button-eng" type="button" class="button-lang"> English </button>
        </div>
        <div class="right-side">
            <section id="about">
                <h3 class="main-color" id="headline-1"> </h3>
                <p id="base-1" class="base"> </p>
            </section>
            <h3 class="main-color" id="headline-2"> </h3>
            <p id="base-2" class="base"> </p>
            <section id="contacts">
                <h3 class="main-color" id="headline-3"> </h3>
                <p id="base-3" class="base"> </p>
            </section>
            <section id="projects">
                <h3 class="main-color" id="headline-4"> </h3>
                <p id="base-4" class="base"> </p>
            </section>
        </div>
    </div>
</body>
</html>
